    background: var(--bg);
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", "Ubuntu Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
    color: var(--fg);
    -webkit-text-size-adjust: 100%;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: max(6px, env(safe-area-inset-top)) 10px 6px;
    background: var(--panel);
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
    color: var(--dim);
    user-select: none;
  }

  header .title { color: var(--fg) }
  header .spacer { flex: 1 }

  #target {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--fg);
  }

  #target.unlinked { color: var(--warn) }

  button {
    font: inherit;
    color: var(--dim);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0 12px;
    min-height: 36px;
    cursor: pointer;
    flex: none;
    -webkit-tap-highlight-color: transparent;
  }

  button:hover, button:focus-visible { color: var(--fg); border-color: var(--dim) }
  button:focus-visible { outline: 2px solid var(--prompt); outline-offset: 1px }
  button:active { background: #1c211e }

  #menu { font-size: 17px; padding: 0 13px }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 4px;
    -webkit-overflow-scrolling: touch;
  }

  .day {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 12px;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .08em;
    user-select: none;
  }

  .day::before, .day::after { content: ''; flex: 1; height: 1px; background: var(--rule) }
  .day:first-of-type { margin-top: 2px }

  .chapter {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0 18px;
    color: var(--prompt);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    user-select: none;
  }

  .chapter::before, .chapter::after { content: ''; flex: 1; height: 1px; background: var(--prompt); opacity: .35 }
  .chapter .stamp { flex: none; color: var(--dim); font-size: 10px; letter-spacing: normal; text-transform: none }

  .entry { display: flex; gap: 10px; margin-bottom: 11px }

  .entry .stamp {
    flex: none;
    width: 56px;
    padding-top: 3px;
    color: var(--stamp);
    font-size: 11px;
  }

  .entry .text {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .entry.flag .text { color: #e06c6c }
  .entry.flag .stamp { color: #a05555 }

  .notice { color: var(--dim); padding: 4px 0 14px; white-space: pre-wrap }
  .notice b { color: var(--warn); font-weight: normal }

  form {
    flex: none;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--rule);
  }

  .caret { color: var(--prompt); padding-top: 1px; user-select: none }

  textarea {
    flex: 1;
    font: inherit;
    font-size: 16px;
    color: var(--fg);
    background: none;
    border: none;
    outline: none;
    resize: none;
    height: 26px;
    max-height: 140px;
    padding: 0;
    caret-color: var(--prompt);
  }

  textarea::placeholder { color: var(--dim) }

  .sheet {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: flex-end;
    background: rgba(0, 0, 0, .62);
  }

  .sheet[hidden] { display: none }

  .box {
    width: 100%;
    max-height: 82%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-top: 1px solid var(--rule);
    border-radius: 12px 12px 0 0;
    animation: rise .16s ease-out;
  }

  @keyframes rise { from { transform: translateY(14px) } to { transform: none } }
  @media (prefers-reduced-motion: reduce) { .box { animation: none } }

  .box .grip {
    flex: none;
    width: 34px;
    height: 4px;
    border-radius: 2px;
    background: var(--rule);
    margin: 8px auto 2px;
  }

  .box .head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 10px;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
    color: var(--dim);
  }

  .box .head .spacer { flex: 1 }

  #tasklist { flex: 1; overflow-y: auto; padding: 2px 12px }

  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    border-bottom: 1px solid var(--rule);
  }

  .task .n { flex: none; min-width: 18px; color: var(--dim); font-size: 12px }
  .task .v { flex: 1; min-width: 0; padding: 8px 0; word-wrap: break-word; overflow-wrap: anywhere }

  .task .x {
    flex: none;
    border: none;
    background: none;
    color: var(--dim);
    font-size: 19px;
    min-height: 40px;
    padding: 0 8px;
    border-radius: 4px;
  }

  .task .x:hover, .task .x:focus-visible { color: #e06c6c; border-color: transparent }
  .empty { color: var(--dim); padding: 14px 0 }

  .menu { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)) }

  .menu .row {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    padding: 2px 2px 12px;
  }

  .menu .wide {
    display: block;
    width: 100%;
    text-align: left;
    min-height: 44px;
    margin-bottom: 8px;
  }

  #taskform, #chapterform {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--rule);
  }

  #taskinput, #chapterinput {
    flex: 1;
    font: inherit;
    font-size: 16px;
    color: var(--fg);
    background: none;
    border: none;
    outline: none;
    padding: 0;
    min-height: 34px;
    caret-color: var(--prompt);
  }

  #taskinput::placeholder, #chapterinput::placeholder { color: var(--dim) }
</style>
</head>
<body>

<header>
  <span class="title">logbook</span>
  <span id="count">0 entries</span>
  <span class="spacer"></span>
  <button id="chapter" type="button">chapter</button>
  <button id="tasks" type="button">tasks</button>
  <button id="menu" type="button" aria-label="file menu">&#9776;</button>
</header>

<div id="sheet" class="sheet" hidden>
  <div class="box">
    <div class="grip"></div>
    <div class="head">
      <span>open missions</span>
      <span class="spacer"></span>
      <button id="print" type="button">print</button>
      <button id="close" type="button">close</button>
    </div>
    <div id="tasklist"></div>
    <form id="taskform">
      <span class="caret">+</span>
      <input id="taskinput" type="text" placeholder="new mission" autocomplete="off" autocapitalize="sentences" spellcheck="false">
    </form>
  </div>
</div>

<div id="csheet" class="sheet" hidden>
  <div class="box">
    <div class="grip"></div>
    <div class="head">
      <span>new chapter</span>
      <span class="spacer"></span>
      <button id="cclose" type="button">close</button>
    </div>
    <form id="chapterform">
      <span class="caret">&sect;</span>
      <input id="chapterinput" type="text" placeholder="chapter title (optional), press enter" autocomplete="off" autocapitalize="sentences" spellcheck="false">
    </form>
  </div>
</div>

<div id="msheet" class="sheet" hidden>
  <div class="box">
    <div class="grip"></div>
    <div class="head">
      <span>file</span>
      <span class="spacer"></span>
      <button id="mclose" type="button">close</button>
    </div>
    <div class="menu">
      <div class="row">
        <span>writing to</span>
        <span id="target" class="unlinked">no file</span>
      </div>
      <button id="open" class="wide" type="button">open an existing log</button>
      <button id="new" class="wide" type="button">create a new log</button>
      <button id="send" class="wide" type="button">share the file</button>
    </div>
  </div>
</div>

<main id="log">
  <div class="notice" id="notice"></div>
</main>

<form id="form">
  <span class="caret">&gt;</span>
  <textarea id="input" rows="1" placeholder="write a line, press enter" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
</form>

<script>
  const log = document.getElementById('log')
  const notice = document.getElementById('notice')
  const input = document.getElementById('input')
  const form = document.getElementById('form')
  const count = document.getElementById('count')
  const target = document.getElementById('target')
  const openBtn = document.getElementById('open')
  const newBtn = document.getElementById('new')

  const canOpen = typeof window.showOpenFilePicker === 'function'
  const canCreate = typeof window.showSaveFilePicker === 'function'
  const hasFS = canOpen || canCreate
  const STAMP = /^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\] ([\s\S]*)$/
  const TASK = /^task ([+\-]) ([\s\S]*)$/
  const CHAPTER = /^chapter ([\s\S]*)$/

  const sheet = document.getElementById('sheet')
  const tasklist = document.getElementById('tasklist')
  const taskform = document.getElementById('taskform')
  const taskinput = document.getElementById('taskinput')
  const tasksBtn = document.getElementById('tasks')
  const msheet = document.getElementById('msheet')
  const menuBtn = document.getElementById('menu')
  const csheet = document.getElementById('csheet')
  const chapterform = document.getElementById('chapterform')
  const chapterinput = document.getElementById('chapterinput')
  const chapterBtn = document.getElementById('chapter')

  let handle = null
  let entries = []

  /* ---------- handle persistence ---------- */

  function db() {
    return new Promise(function (res, rej) {
      const r = indexedDB.open('logbook', 1)
      r.onupgradeneeded = function () { r.result.createObjectStore('kv') }
      r.onsuccess = function () { res(r.result) }
      r.onerror = function () { rej(r.error) }
    })
  }

  async function putHandle(h) {
    const d = await db()
    await new Promise(function (res, rej) {
      const tx = d.transaction('kv', 'readwrite')
      tx.objectStore('kv').put(h, 'file')
      tx.oncomplete = res
      tx.onerror = function () { rej(tx.error) }
    })
  }

  async function getHandle() {
    const d = await db()
    return new Promise(function (res) {
      const tx = d.transaction('kv', 'readonly')
      const q = tx.objectStore('kv').get('file')
      q.onsuccess = function () { res(q.result || null) }
      q.onerror = function () { res(null) }
    })
  }

  /* ---------- format ---------- */

  function pad(n) { return String(n).padStart(2, '0') }

  function stampNow() {
    const d = new Date()
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
  }

  function parse(text) {
    const out = []
    text.replace(/^\uFEFF/, '').split('\n').forEach(function (line) {
      const m = line.match(STAMP)
      if (m) {
        let v = m[2]
        const op = v.match(TASK)
        if (op) {
          out.push({ t: m[1], v: op[2], kind: op[1] === '+' ? 'add' : 'del' })
          return
        }
        const ch = v.match(CHAPTER)
        if (ch) {
          out.push({ t: m[1], v: ch[1], kind: 'chapter' })
          return
        }
        const flag = v.charAt(0) === '\u200B'
        if (flag) v = v.slice(1)
        out.push({ t: m[1], v: v, flag: flag, kind: 'log' })
      } else if (out.length && line !== '') {
        out[out.length - 1].v += '\n' + line
      }
    })
    return out
  }

  function serialize() {
    return '\uFEFF' + entries.map(function (e) {
      let body
      if (e.kind === 'add') body = 'task + ' + e.v
      else if (e.kind === 'del') body = 'task - ' + e.v
      else if (e.kind === 'chapter') body = 'chapter ' + e.v
      else body = (e.flag ? '\u200B' : '') + e.v
      return '[' + e.t + '] ' + body
    }).join('\n') + '\n'
  }

  /* ---------- render ---------- */

  let shownDay = null

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']

  function dayLabel(iso) {
    const p = iso.split('-')
    const d = new Date(+p[0], +p[1] - 1, +p[2])
    const today = new Date()
    const same = d.toDateString() === today.toDateString()
    return (same ? 'today  ' : '') + DAYS[d.getDay()] + ' ' + (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0]
  }

  function render(entry) {
    const day = entry.t.slice(0, 10)
    if (day !== shownDay) {
      shownDay = day
      const sep = document.createElement('div')
      sep.className = 'day'
      const label = document.createElement('span')
      label.textContent = dayLabel(day)
      sep.appendChild(label)
      log.appendChild(sep)
    }
    if (entry.kind === 'chapter') {
      const div = document.createElement('div')
      div.className = 'chapter'
      const label = document.createElement('span')
      label.textContent = entry.v || 'chapter'
      const s = document.createElement('span')
      s.className = 'stamp'
      s.textContent = entry.t.slice(11)
      div.appendChild(label)
      div.appendChild(s)
      log.appendChild(div)
      return
    }
    const div = document.createElement('div')
    div.className = entry.flag ? 'entry flag' : 'entry'
    const s = document.createElement('span')
    s.className = 'stamp'
    s.textContent = entry.t.slice(11)
    const t = document.createElement('div')
    t.className = 'text'
    t.textContent = entry.v
    div.appendChild(s)
    div.appendChild(t)
    log.appendChild(div)
  }

  function redraw() {
    Array.prototype.slice.call(log.querySelectorAll('.entry, .day, .chapter')).forEach(function (n) { n.remove() })
    shownDay = null
    entries.forEach(function (e) { if (e.kind !== 'add' && e.kind !== 'del') render(e) })
    refresh()
    bottom()
  }

  function refresh() {
    const n = entries.filter(function (e) { return e.kind === 'log' }).length
    count.textContent = n + (n === 1 ? ' entry' : ' entries')
    const open = missions().length
    tasksBtn.textContent = open ? 'tasks ' + open : 'tasks'
  }

  /* ---------- missions ---------- */

  function missions() {
    const list = []
    entries.forEach(function (e) {
      if (e.kind === 'add') {
        if (list.indexOf(e.v) === -1) list.push(e.v)
      } else if (e.kind === 'del') {
        const i = list.indexOf(e.v)
        if (i !== -1) list.splice(i, 1)
      }
    })
    return list
  }

  function drawTasks() {
    tasklist.innerHTML = ''
    const list = missions()
    if (!list.length) {
      const p = document.createElement('div')
      p.className = 'empty'
      p.textContent = 'nothing open'
      tasklist.appendChild(p)
      return
    }
    list.forEach(function (v, i) {
      const row = document.createElement('div')
      row.className = 'task'
      const n = document.createElement('span')
      n.className = 'n'
      n.textContent = (i + 1) + '.'
      const t = document.createElement('span')
      t.className = 'v'
      t.textContent = v
      const x = document.createElement('button')
      x.className = 'x'
      x.type = 'button'
      x.textContent = '\u00d7'
      x.setAttribute('aria-label', 'remove')
      x.addEventListener('click', function () { removeMission(v) })
      row.appendChild(n)
      row.appendChild(t)
      row.appendChild(x)
      tasklist.appendChild(row)
    })
  }

  async function commit(entry) {
    entries.push(entry)
    try {
      await writeFile()
    } catch (e) {
      entries.pop()
      say('Write failed, nothing was logged: ' + (e && e.message ? e.message : e), true)
      return false
    }
    return true
  }

  async function addMission(v) {
    if (!v) return
    if (missions().indexOf(v) !== -1) return
    if (await commit({ t: stampNow(), v: v, kind: 'add' })) {
      drawTasks()
      refresh()
    }
  }

  async function removeMission(v) {
    if (missions().indexOf(v) === -1) return
    if (await commit({ t: stampNow(), v: v, kind: 'del' })) {
      drawTasks()
      refresh()
    }
  }

  async function addChapter(title) {
    const entry = { t: stampNow(), v: title, kind: 'chapter' }
    if (!await commit(entry)) return
    render(entry)
    refresh()
    bottom()
  }

  function printMissions() {
    const list = missions()
    const body = list.length
      ? 'tasks (' + list.length + ')\n' + list.map(function (v, i) { return (i + 1) + '. ' + v }).join('\n')
      : 'tasks (0)'
    return add(body, true)
  }

  function openSheet() {
    drawTasks()
    sheet.hidden = false
    taskinput.focus()
  }

  function closeSheet() {
    sheet.hidden = true
    taskinput.value = ''
  }

  function bottom() { log.scrollTop = log.scrollHeight }

  function say(msg, warn) {
    notice.innerHTML = ''
    const b = document.createElement(warn ? 'b' : 'span')
    b.textContent = msg
    notice.appendChild(b)
  }

  /* ---------- file io ---------- */

  async function allowed(h, mode) {
    const opts = { mode: mode }
    if (await h.queryPermission(opts) === 'granted') return true
    return await h.requestPermission(opts) === 'granted'
  }

  async function readFile() {
    const f = await handle.getFile()
    entries = parse(await f.text())
  }

  async function writeFile() {
    const w = await handle.createWritable()
    await w.write(serialize())
    await w.close()
  }

  function connected() {
    target.textContent = handle.name
    target.classList.remove('unlinked')
    msheet.hidden = true
    say('')
  }

  async function link(mode) {
    const carry = mode === 'new' ? missions() : []
    const previous = handle ? handle.name : null
    try {
      if (mode === 'new') {
        const d = new Date()
        const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()]
        const name = 'logbook_' +
          d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
          '_' + dow + '_' +
          pad(d.getHours()) + '-' + pad(d.getMinutes()) + '-' + pad(d.getSeconds()) + '.txt'
        handle = await window.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: 'Text', accept: { 'text/plain': ['.txt'] } }]
        })
      } else {
        const picked = await window.showOpenFilePicker({
          multiple: false,
          types: [{ description: 'Text', accept: { 'text/plain': ['.txt', '.log', '.md'] } }]
        })
        handle = picked[0]
      }
      if (!await allowed(handle, 'readwrite')) {
        handle = null
        say('Write access denied. Open the menu and try again.', true)
        return
      }
      await putHandle(handle)
      await readFile()
      let carried = 0
      if (mode === 'new' && !entries.length && carry.length) {
        if (previous) entries.push({ t: stampNow(), v: 'continued from ' + previous, kind: 'log' })
        carry.forEach(function (v) { entries.push({ t: stampNow(), v: v, kind: 'add' }) })
        await writeFile()
        carried = carry.length
      }
      connected()
      redraw()
      if (carried) {
        say('Carried over ' + carried + (carried === 1 ? ' open mission.' : ' open missions.'))
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return
      say('Could not use that file: ' + (e && e.message ? e.message : e), true)
    }
  }

  async function restore() {
    const h = await getHandle()
    if (!h) {
      say('Tap the menu button to create a log file, or open one you already have. Every line goes straight into it.')
      return
    }
    handle = h
    target.textContent = h.name
    if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') {
      await readFile()
      connected()
      redraw()
    } else {
      say('Open the menu and pick ' + h.name + ' to reconnect it for this session.', true)
    }
  }

  /* ---------- input ---------- */

  async function add(text, raw) {
    if (!handle) {
      say('No file linked yet. Tap the menu to open or create one.', true)
      return
    }

    if (!raw) {
      if (text === '?') return printMissions()

      if (text.charAt(0) === '+' || text.charAt(0) === '#') {
        return addMission(text.slice(1).trim())
      }

      if (text.charAt(0) === '-') {
        const rest = text.slice(1).trim()
        const list = missions()
        if (/^\d+$/.test(rest)) {
          const pick = list[parseInt(rest, 10) - 1]
          if (!pick) {
            say('No mission number ' + rest + '.', true)
            return
          }
          return removeMission(pick)
        }
        if (list.indexOf(rest) === -1) {
          say('No open mission matching that.', true)
          return
        }
        return removeMission(rest)
      }
    }

    let flag = false
    if (!raw && text.charAt(0) === '.') {
      flag = true
      text = text.slice(1).trim()
      if (!text) return
    }

    const entry = { t: stampNow(), v: text, flag: flag, kind: 'log' }
    if (!await commit(entry)) return
    render(entry)
    refresh()
    bottom()
  }

  function autosize() {
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight, 140) + 'px'
  }

  input.addEventListener('input', autosize)

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      form.requestSubmit()
    }
  })

  form.addEventListener('submit', function (e) {
    e.preventDefault()
    const text = input.value.trim()
    if (!text) return
    input.value = ''
    autosize()
    add(text)
  })

  openBtn.addEventListener('click', function () { link('open') })
  newBtn.addEventListener('click', function () { link('new') })

  menuBtn.addEventListener('click', function () { msheet.hidden = false })
  document.getElementById('mclose').addEventListener('click', function () { msheet.hidden = true })

  tasksBtn.addEventListener('click', function () {
    if (!handle) {
      say('No file linked yet. Tap the menu to open or create one.', true)
      return
    }
    openSheet()
  })

  document.getElementById('close').addEventListener('click', closeSheet)

  document.getElementById('print').addEventListener('click', async function () {
    await printMissions()
    closeSheet()
  })

  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet() })
  msheet.addEventListener('click', function (e) { if (e.target === msheet) msheet.hidden = true })

  function closeChapterSheet() {
    csheet.hidden = true
    chapterinput.value = ''
  }

  chapterBtn.addEventListener('click', function () {
    if (!handle) {
      say('No file linked yet. Tap the menu to open or create one.', true)
      return
    }
    csheet.hidden = false
    chapterinput.focus()
  })

  document.getElementById('cclose').addEventListener('click', closeChapterSheet)
  csheet.addEventListener('click', function (e) { if (e.target === csheet) closeChapterSheet() })

  chapterform.addEventListener('submit', function (e) {
    e.preventDefault()
    const v = chapterinput.value.trim()
    closeChapterSheet()
    addChapter(v)
  })

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return
    if (!sheet.hidden) closeSheet()
    if (!msheet.hidden) msheet.hidden = true
    if (!csheet.hidden) closeChapterSheet()
  })

  taskform.addEventListener('submit', function (e) {
    e.preventDefault()
    const v = taskinput.value.trim()
    if (!v) return
    taskinput.value = ''
    addMission(v)
  })

  document.getElementById('send').addEventListener('click', async function () {
    if (!handle) {
      say('No file linked yet.', true)
      return
    }
    const blob = new Blob([serialize()], { type: 'text/plain' })
    const file = new File([blob], handle.name, { type: 'text/plain' })
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: handle.name })
        return
      }
      throw new Error('sharing unavailable')
    } catch (e) {
      if (e && e.name === 'AbortError') return
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = handle.name
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
      setTimeout(function () { URL.revokeObjectURL(url) }, 1000)
      say('Share not available here, so the file was downloaded instead.', true)
    }
  })

  /* ---------- boot ---------- */

  if (!hasFS) {
    openBtn.disabled = true
    newBtn.disabled = true
    say('This browser cannot write directly to a file. Open this page in Chrome on Android.', true)
  } else {
    openBtn.disabled = !canOpen
    newBtn.disabled = !canCreate
    restore()
  }
</script>

</body>
</html>
